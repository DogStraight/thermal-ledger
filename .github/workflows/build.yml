name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ThermalLedger `
            --paths src `
            --add-data "src/thermal_ledger/translations;thermal_ledger/translations" `
            launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ThermalLedger-windows
          path: dist/ThermalLedger.exe
