[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermal-ledger"
version = "0.1.0"
description = "Minimal, pluggable GPU thermal coefficient and long-term ledger for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thermal Ledger contributors" }]
keywords = ["gpu", "thermal", "cooling", "throttling", "windows"]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/DogStraight/thermal-ledger"
Repository = "https://github.com/DogStraight/thermal-ledger"
Issues = "https://github.com/DogStraight/thermal-ledger/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6"]

[project.gui-scripts]
thermal-ledger = "thermal_ledger.app:main"

[project.entry-points."thermal_ledger.sensors"]
nvml = "thermal_ledger.sensors.nvml:NvmlSensor"

[project.entry-points."thermal_ledger.loads"]
builtin = "thermal_ledger.loads.builtin:BuiltinLoad"
external = "thermal_ledger.loads.external:ExternalLoad"
command = "thermal_ledger.loads.command:CommandLoad"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
